name: Sync Match Results

on:
  schedule:
    # Every 6 hours during tournament (Jun 11 – Jul 19)
    - cron: '0 */6 * 6 *'
  workflow_dispatch:
    # Manual trigger for testing

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install dependencies
        run: npm ci --omit=dev
      
      - name: Fetch match results & recompute
        run: node scripts/sync-matches.mjs
        env:
          SPORTSRC_KEY: ${{ secrets.SPORTSRC_KEY }}
      
      - name: Commit updated data
        run: |
          git config user.name "match-sync-bot"
          git config user.email "bot@worldcup2026.app"
          git add data/live-results.json
          git diff --cached --quiet || (git commit -m "sync match results $(date -u +'%Y-%m-%dT%H:%MZ')" && git push)
